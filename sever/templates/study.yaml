# sever study. Everything above `results:` is frozen by `sever freeze` and may not change afterwards.
# Write numbers. "Better" is not a criterion. "At least 2x, for every K tested" is.
slug: {slug}
title: ""
created: {date}

theory:
  name: {slug}
  version: 1
  supersedes: null          # "name@version" this replaces. Required when version > 1.
  statement: |
    One paragraph. What the world is like if this is true. It must be possible for this to be wrong.
  formal: |
    Optional. Model, equations, assumptions. Mark which predictions follow from the math
    (those test the code, not the theory) and which are conjectures.
  scope: |
    The systems this claim is about. No claim is made outside it.
  prior_credence: 0.3       # your honest probability the theory is true within scope, before any data

alternatives:               # at least one rival that would produce similar-looking data
  - id: H0
    statement: ""

predictions:
  - id: P1
    statement: ""
    critical: true          # a critical failure refutes this version
    pass_if: ""             # operational, with numbers, decided now
    fail_if: ""             # operational, with numbers, decided now. Anything else is inconclusive.
    p_pass_if_true: 0.8     # P(pass | theory true)
    p_pass_if_false: 0.2    # P(pass | best rival true). A ratio under 3 is a demonstration, not a test.
    discriminates: [H0]     # rivals a pass counts against
    outcome: null           # pass | fail | inconclusive. Filled after data by applying the criteria literally.
    evidence: null          # the figure, table, or number that decided it

analysis_plan: |
  Exactly what is computed: parameters, seeds, sample sizes, horizons, the statistic,
  which nuisance parameters are varied, which effect sizes are reported.

kill_rule: |
  The outcome under which this version is abandoned, and what a revision must add:
  a new risky prediction that the data which killed this one do not already entail.

# ---------------- written after data ----------------
results:
  summary: null             # plain words, effect sizes, robustness checks
  exploratory: []           # not preregistered: [{finding: "", next_test: ""}]. Hypotheses, not results.

review:                     # adversarial. Written by you, in the voice of your sharpest critic, before `sever verdict`.
  strongest_objection: null
  confounds_checked: []
  what_would_change_my_mind: null
