slug: latency-cache
title: Query-result caching on a fixed local workload
created: '2026-01-01'
theory:
  name: latency-cache
  version: 1
  supersedes: null
  statement: Caching repeated queries reduces median latency without changing results.
  formal: median(cached_ms) / median(baseline_ms) < 0.80
  scope: A single local retrieval service on a fixed 100-query synthetic workload.
  prior_credence: 0.5
alternatives:
  - id: H0
    statement: The apparent gain is warmup or request-order noise.
predictions:
  - id: P1
    statement: Caching reduces median latency by at least 20 percent.
    critical: true
    pass_if: Median latency ratio over 10 seeds is below 0.80.
    fail_if: Median latency ratio over 10 seeds is at least 0.95.
    p_pass_if_true: 0.8
    p_pass_if_false: 0.2
    p_fail_if_true: 0.1
    p_fail_if_false: 0.6
    discriminates: [H0]
    outcome: null
    evidence: null
  - id: P2
    statement: Cached and uncached results agree exactly.
    critical: true
    pass_if: Result mismatch count is 0 over all 100 queries and 10 seeds.
    fail_if: Result mismatch count is at least 1.
    p_pass_if_true: 0.98
    p_pass_if_false: 0.5
    p_fail_if_true: 0.01
    p_fail_if_false: 0.49
    discriminates: [H0]
    outcome: null
    evidence: null
analysis_plan: >-
  Before measurement, save the workload and source commit hashes. Use seeds 0-9
  to shuffle 100 synthetic queries; run both variants on each order. Exclude 20
  warmup requests for each variant. Save every measured duration and result hash.
  Report the ratio of medians across all measured requests and total mismatches.
  Ratios from 0.80 inclusive to 0.95 exclusive are inconclusive for P1.
kill_rule: Abandon this cache version if either critical prediction fails.
results:
  summary: null
  exploratory: []
review:
  strongest_objection: null
  confounds_checked: []
  what_would_change_my_mind: null
