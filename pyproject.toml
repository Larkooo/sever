[project]
name = "sever"
version = "0.1.0"
description = "A research framework that makes theories earn their keep: preregistered predictions, severity-weighted evidence, mechanical verdicts, and a graveyard."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
sever = "sever.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sever"]

[tool.setuptools.package-data]
sever = ["templates/*"]
